server:
  port: 8082
  servlet:
    context-path: /
spring:
  application:
    name: unichem-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unichem_inventory}
    username: ${DB_USER_Inventory:postgres}
    password: ${DB_PASSWORD_Inventory:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 200
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
app:
  jwt:
    # 256-bit secret, base64. Override in every real environment: APP_JWT_SECRET
    secret: ${APP_JWT_SECRET:dW5pY2hlbS1pbnZlbnRvcnktZGV2LXNlY3JldC1jaGFuZ2UtbWUtMjU2Yml0cyE=}
    ttl-minutes: ${APP_JWT_TTL:480}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200,http://10.1.19.117:8081,http://10.1.19.117:8085,http://ims.unichemlabs.com:8085,https://ims.unichemlabs.com:8085}
  auto-import:
    allowed-directories: ${APP_AUTO_IMPORT_DIRS:C:\Inventory_Sap}
    default-folder: ${APP_AUTO_IMPORT_FOLDER:C:\Inventory_Sap}
    default-file: ${APP_AUTO_IMPORT_FILE:SAP_Inventory.xlsx}
    default-frequency-hours: ${APP_AUTO_IMPORT_FREQ_HOURS:24}
logging:
  level:
    org.hibernate.SQL: warn
